[workspace]
members = [
  "tra86-app",
  "tra86-core",
  "tra86-backend",
  "tra86-backend-lldb",
  "tra86-analysis",
  "tra86-ui",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["tra86 contributors"]

[workspace.dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
eframe = { version = "0.31", default-features = true }
egui = "0.31"
egui_extras = "0.31"
egui_dock = "0.16"
anyhow = "1"
